name: Import companies

# Imports Estonian construction firms from the Business Register open data into the
# production database. Run it by hand from the Actions tab. Needs the DATABASE_URL secret.
on:
  workflow_dispatch:
    inputs:
      main_only:
        description: Only firms whose main activity is construction
        type: boolean
        default: false
      dry_run:
        description: Parse and count only, don't write to the database
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx tsx scripts/import-companies.ts
          ${{ inputs.main_only && '--main-only' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
